name: PR Quality Gate

on:
  pull_request:
    branches:
      - Develop
      - UAT
      - main

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: pr-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lwc-and-static-analysis:
    name: LWC ESLint, Jest Coverage, Apex PMD
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java for PMD
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Detect LWC source folders
        id: lwc-source
        shell: bash
        run: |
          if [ -d force-app/main/default/lwc ]; then
            echo "has_lwc_sources=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_lwc_sources=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip LWC ESLint and Jest
        if: steps.lwc-source.outputs.has_lwc_sources == 'false'
        run: echo "No LWC folder exists in this branch."

      - name: Lint LWC
        if: steps.lwc-source.outputs.has_lwc_sources == 'true'
        run: npm run lint:lwc

      - name: Run LWC Jest with coverage
        if: steps.lwc-source.outputs.has_lwc_sources == 'true'
        run: npm run test:unit:coverage:ci

      - name: Enforce LWC Jest coverage >= 85%
        if: steps.lwc-source.outputs.has_lwc_sources == 'true'
        run: npm run coverage:lwc:check

      - name: Upload Jest coverage artifact
        uses: actions/upload-artifact@v4
        if: always() && steps.lwc-source.outputs.has_lwc_sources == 'true'
        with:
          name: lwc-jest-coverage
          path: coverage/

      - name: Detect Apex source folders
        id: apex-source
        shell: bash
        run: |
          target_args=()
          [ -d force-app/main/default/classes ] && target_args+=("--target" "force-app/main/default/classes")
          [ -d force-app/main/default/triggers ] && target_args+=("--target" "force-app/main/default/triggers")

          if [ "${#target_args[@]}" -gt 0 ]; then
            echo "has_apex_sources=true" >> "$GITHUB_OUTPUT"
            printf 'target_args=%s\n' "${target_args[*]}" >> "$GITHUB_OUTPUT"
          else
            echo "has_apex_sources=false" >> "$GITHUB_OUTPUT"
            echo "target_args=" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip Apex PMD
        if: steps.apex-source.outputs.has_apex_sources == 'false'
        run: echo "No Apex classes or triggers folder exists in this branch."

      - name: Install Salesforce CLI
        if: steps.apex-source.outputs.has_apex_sources == 'true'
        run: npm install --global @salesforce/cli@latest

      - name: Install Salesforce Code Analyzer
        if: steps.apex-source.outputs.has_apex_sources == 'true'
        run: sf plugins install code-analyzer@latest

      - name: Run Apex PMD through Salesforce Code Analyzer
        if: steps.apex-source.outputs.has_apex_sources == 'true'
        id: code-analyzer
        uses: forcedotcom/run-code-analyzer@v2
        with:
          run-arguments: --workspace . ${{ steps.apex-source.outputs.target_args }} --rule-selector pmd --view detail --output-file sfca_results.html --output-file sfca_results.json
          results-artifact-name: salesforce-code-analyzer-results
          github-token: ${{ github.token }}

      - name: Enforce critical Apex PMD quality gate
        if: |
          steps.apex-source.outputs.has_apex_sources == 'true' && (
            steps.code-analyzer.outputs.num-sev1-violations-in-changed-files > 0
          )
        run: |
          echo "Apex PMD gate failed. Fix Critical PMD issues in changed files."
          exit 1

  apex-validation:
    name: Apex Validation and Coverage
    runs-on: ubuntu-latest
    needs: lwc-and-static-analysis
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect Apex changes
        id: apex-changes
        shell: bash
        run: |
          apex_changed=false
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" \
            | grep -E '^force-app/main/default/(classes|triggers)/.*\.(cls|trigger)(-meta\.xml)?$'; then
            apex_changed=true
          fi

          source_dirs=()
          [ -d force-app/main/default/classes ] && source_dirs+=("--source-dir" "force-app/main/default/classes")
          [ -d force-app/main/default/triggers ] && source_dirs+=("--source-dir" "force-app/main/default/triggers")

          if [ "${apex_changed}" = "true" ] && [ "${#source_dirs[@]}" -gt 0 ]; then
            echo "apex_changed=true" >> "$GITHUB_OUTPUT"
            printf 'source_dirs=%s\n' "${source_dirs[*]}" >> "$GITHUB_OUTPUT"
          else
            echo "apex_changed=false" >> "$GITHUB_OUTPUT"
            echo "source_dirs=" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip Apex validation
        if: steps.apex-changes.outputs.apex_changed == 'false'
        run: echo "No Apex classes or triggers changed in this PR."

      - name: Setup Node for Salesforce CLI
        if: steps.apex-changes.outputs.apex_changed == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Salesforce CLI
        if: steps.apex-changes.outputs.apex_changed == 'true'
        run: npm install --global @salesforce/cli@latest

      - name: Authenticate target validation org
        if: steps.apex-changes.outputs.apex_changed == 'true'
        env:
          SF_INTELDEPLOYHUB_CLIENT_ID: ${{ secrets.SF_INTELDEPLOYHUB_CLIENT_ID }}
          SF_INTELDEPLOYHUB_CLIENT_SECRET: ${{ secrets.SF_INTELDEPLOYHUB_CLIENT_SECRET }}
          SF_INTELDEPLOYHUB_INSTANCE_URL: ${{ secrets.SF_INTELDEPLOYHUB_INSTANCE_URL }}
          SF_INTELUAT_CLIENT_ID: ${{ secrets.SF_INTELUAT_CLIENT_ID }}
          SF_INTELUAT_CLIENT_SECRET: ${{ secrets.SF_INTELUAT_CLIENT_SECRET }}
          SF_INTELUAT_INSTANCE_URL: ${{ secrets.SF_INTELUAT_INSTANCE_URL }}
        shell: bash
        run: |
          case "${{ github.base_ref }}" in
            Develop|main)
              client_id="${SF_INTELDEPLOYHUB_CLIENT_ID}"
              client_secret="${SF_INTELDEPLOYHUB_CLIENT_SECRET}"
              instance_url="${SF_INTELDEPLOYHUB_INSTANCE_URL}"
              ;;
            UAT)
              client_id="${SF_INTELUAT_CLIENT_ID}"
              client_secret="${SF_INTELUAT_CLIENT_SECRET}"
              instance_url="${SF_INTELUAT_INSTANCE_URL}"
              ;;
            *)
              echo "No validation org configured for base branch ${{ github.base_ref }}."
              exit 1
              ;;
          esac

          missing=()
          [ -n "$client_id" ] || missing+=("client_id")
          [ -n "$client_secret" ] || missing+=("client_secret")
          [ -n "$instance_url" ] || missing+=("instance_url")
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing target org auth value: %s\n' "${missing[@]}"
            exit 1
          fi

          token_response="$(curl --silent --show-error --fail \
            --request POST "${instance_url}/services/oauth2/token" \
            --form grant_type=client_credentials \
            --form client_id="${client_id}" \
            --form client_secret="${client_secret}")"
          export SF_ACCESS_TOKEN
          SF_ACCESS_TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])' <<< "$token_response")"
          sf org login access-token \
            --instance-url "${instance_url}" \
            --no-prompt \
            --alias TARGET_ORG

      - name: Validate deployment and run Apex tests
        if: steps.apex-changes.outputs.apex_changed == 'true'
        shell: bash
        run: |
          set -o pipefail
          sf project deploy validate \
            ${{ steps.apex-changes.outputs.source_dirs }} \
            --target-org TARGET_ORG \
            --test-level RunLocalTests \
            --wait 120 \
            --json | tee deploy-result.json

      - name: Enforce Apex coverage >= 85%
        if: steps.apex-changes.outputs.apex_changed == 'true'
        run: npm run coverage:apex:check

      - name: Upload Apex validation result
        if: always() && steps.apex-changes.outputs.apex_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: apex-validation-result
          path: deploy-result.json
