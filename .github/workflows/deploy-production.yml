name: Deploy Production

on:
  push:
    branches:
      - Main

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Deploy to Production Org
    runs-on: ubuntu-latest
    environment: production
    env:
      HAS_PROD_SECRETS: ${{ secrets.SF_PROD_CLIENT_ID != '' && secrets.SF_PROD_JWT_KEY != '' && secrets.SF_PROD_USERNAME != '' && secrets.SF_PROD_INSTANCE_URL != '' }}
    steps:
      - name: Skip deployment until production secrets are configured
        if: env.HAS_PROD_SECRETS != 'true'
        run: |
          echo "Skipping production deployment because one or more required secrets are missing."
          echo "Required secrets: SF_PROD_CLIENT_ID, SF_PROD_JWT_KEY, SF_PROD_USERNAME, SF_PROD_INSTANCE_URL."

      - name: Checkout
        if: env.HAS_PROD_SECRETS == 'true'
        uses: actions/checkout@v5

      - name: Setup Node
        if: env.HAS_PROD_SECRETS == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Salesforce CLI
        if: env.HAS_PROD_SECRETS == 'true'
        run: npm install --global @salesforce/cli@latest

      - name: Authenticate Production
        if: env.HAS_PROD_SECRETS == 'true'
        shell: bash
        run: |
          mkdir -p .ci
          echo "${{ secrets.SF_PROD_JWT_KEY }}" > .ci/server.key
          sf org login jwt \
            --client-id "${{ secrets.SF_PROD_CLIENT_ID }}" \
            --jwt-key-file .ci/server.key \
            --username "${{ secrets.SF_PROD_USERNAME }}" \
            --instance-url "${{ secrets.SF_PROD_INSTANCE_URL }}" \
            --alias PRODUCTION

      - name: Deploy and run Apex tests
        if: env.HAS_PROD_SECRETS == 'true'
        shell: bash
        run: |
          set -o pipefail
          sf project deploy start \
            --source-dir force-app \
            --target-org PRODUCTION \
            --test-level RunLocalTests \
            --wait 120 \
            --json | tee deploy-result.json

      - name: Enforce Apex coverage >= 75%
        if: env.HAS_PROD_SECRETS == 'true'
        run: node scripts/ci/check-apex-coverage.js deploy-result.json 75

      - name: Upload deployment result
        uses: actions/upload-artifact@v4
        if: always() && env.HAS_PROD_SECRETS == 'true'
        with:
          name: production-deploy-result
          path: deploy-result.json
