name: Deploy INTELDEPLOYHUB

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-inteldeployhub
  cancel-in-progress: false

jobs:
  deploy-inteldeployhub:
    name: Deploy to INTELDEPLOYHUB Org
    runs-on: ubuntu-latest
    environment: INTELDEPLOYHUB
    env:
      HAS_INTELDEPLOYHUB_SECRETS: ${{ secrets.SF_INTELDEPLOYHUB_AUTH_URL != '' }}
    steps:
      - name: Skip deployment until INTELDEPLOYHUB secrets are configured
        if: env.HAS_INTELDEPLOYHUB_SECRETS != 'true'
        run: |
          echo "Skipping INTELDEPLOYHUB deployment because the required secret is missing."
          echo "Required secret: SF_INTELDEPLOYHUB_AUTH_URL."

      - name: Checkout
        if: env.HAS_INTELDEPLOYHUB_SECRETS == 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        if: env.HAS_INTELDEPLOYHUB_SECRETS == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Salesforce CLI
        if: env.HAS_INTELDEPLOYHUB_SECRETS == 'true'
        run: npm install --global @salesforce/cli@latest

      - name: Authenticate INTELDEPLOYHUB
        if: env.HAS_INTELDEPLOYHUB_SECRETS == 'true'
        shell: bash
        run: |
          mkdir -p .ci
          echo "${{ secrets.SF_INTELDEPLOYHUB_AUTH_URL }}" > .ci/inteldeployhub-auth-url.txt
          sf org login sfdx-url \
            --sfdx-url-file .ci/inteldeployhub-auth-url.txt \
            --alias INTELDEPLOYHUB

      - name: Detect Apex changes
        if: env.HAS_INTELDEPLOYHUB_SECRETS == 'true'
        id: apex-changes
        shell: bash
        run: |
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "apex_changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" \
            | grep -E '^force-app/main/default/(classes|triggers)/.*\.(cls|trigger)(-meta\.xml)?$'; then
            echo "apex_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "apex_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy metadata
        if: env.HAS_INTELDEPLOYHUB_SECRETS == 'true'
        shell: bash
        run: |
          set -o pipefail
          test_level="NoTestRun"
          if [ "${{ steps.apex-changes.outputs.apex_changed }}" = "true" ]; then
            test_level="RunLocalTests"
          fi
          echo "Using Salesforce deploy test level: ${test_level}"
          sf project deploy start \
            --source-dir force-app \
            --target-org INTELDEPLOYHUB \
            --test-level "${test_level}" \
            --wait 120 \
            --json | tee deploy-result.json

      - name: Enforce Apex coverage >= 85%
        if: env.HAS_INTELDEPLOYHUB_SECRETS == 'true' && steps.apex-changes.outputs.apex_changed == 'true'
        run: npm run coverage:apex:check

      - name: Upload deployment result
        uses: actions/upload-artifact@v4
        if: always() && env.HAS_INTELDEPLOYHUB_SECRETS == 'true'
        with:
          name: inteldeployhub-deploy-result
          path: deploy-result.json
