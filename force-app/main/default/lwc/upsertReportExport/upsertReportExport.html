<template>

    <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01"
        class="slds-modal slds-fade-in-open slds-modal_large">
        <div class="slds-modal__container">
            <button class="slds-button slds-button_icon slds-modal__close" onclick={handleClose}>
                <svg class="slds-button__icon slds-button__icon_large" aria-hidden="true">
                    <use xlink:href="/_slds/icons/utility-sprite/svg/symbols.svg#close"></use>
                </svg>
                <span class="slds-assistive-text">Cancel and close</span>
            </button>
            <div class="slds-modal__header">
                <h1 id="modal-heading-01" class="slds-modal__title slds-hyphenate" tabindex="-1">
                    <div class="slds-m-top_medium" if:true={edit}>Edit Column</div>
                    <div class="slds-m-top_medium" if:false={edit}>Add New Column</div>
                    </h1>
            </div>
            <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                <div class="slds-grid slds-gutters">
            <div class="slds-col slds-size_3-of-12">
                <lightning-input type="text" label="Label" value={modifiedLabel} onchange={labelChange}></lightning-input>
            </div>
            <div class="slds-col slds-size_3-of-12">
                <div class="slds-grid slds-gutters">
                    <div class="slds-col slds-size_9-of-12">
                        <lightning-input readonly type="text" label="APIName" value={modifiedapiname} onchange={apinameChange}></lightning-input>
                    </div>
                    <div class="slds-col slds-size_3-of-12">
                        <div class="slds-m-top_medium">
                            <lightning-button-icon icon-name="utility:search" alternative-text="Search"  title="Search"  onclick={handleClick}></lightning-button-icon>
                        </div>
                    </div>
                </div>
            </div>
            <div class="slds-col slds-size_3-of-12">
                <div class="slds-m-top_medium" if:true={edit}>
                    <lightning-button variant="brand" label="Update" title="Update" onclick={handleSubmit}></lightning-button>
                </div>
                <div class="slds-m-top_medium" if:false={edit}>
                    <lightning-button variant="brand" label="Save" title="Save" onclick={handleSubmit}></lightning-button>
                </div>
            </div>
        </div>
        <div if:true={showMergeField}>
            <c-merge-fields-modal objectname={objectname} onsave ={handleSaveEvent} onclose={handleCloseEvent}></c-merge-fields-modal>
        </div>
            </div>
            <div class="slds-modal__footer">

            </div>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>

</template>
